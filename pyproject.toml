[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-contract-net-protocol-task-auctioneer-skill"
version = "1.0.0"
description = "FIPA Contract Net Protocol (CNP) multi-agent negotiation engine with task announcement, bidding, and award."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-contract-net-protocol-task-auctioneer-skill"
Repository = "https://github.com/alphaparkinc/genpark-contract-net-protocol-task-auctioneer-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-contract-net-protocol-task-auctioneer-skill/issues"
